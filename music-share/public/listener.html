<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listener - Music Sync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .room-info {
      font-size: 0.95em;
      opacity: 0.8;
    }
    
    .status {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-weight: bold;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .status.connecting {
      background: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }
    
    .status.downloading {
      background: rgba(59, 130, 246, 0.3);
      color: #3b82f6;
    }
    
    .status.syncing {
      background: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }
    
    .status.ready {
      background: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    
    .status.error {
      background: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .player {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
    }
    
    .track-info {
      text-align: center;
      margin-bottom: 25px;
    }
    
    .track-title {
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .track-artist {
      font-size: 0.95em;
      opacity: 0.7;
    }
    
    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      border-radius: 5px;
      transition: width 0.1s linear;
    }
    
    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.95em;
      opacity: 0.8;
    }
    
    .playback-indicator {
      text-align: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 20px;
      font-size: 0.9em;
    }
    
    .playback-indicator.playing {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }
    
    .playback-indicator.paused {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }
    
    .sync-stats {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .sync-stats h3 {
      font-size: 1.1em;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-label {
      font-size: 0.8em;
      opacity: 0.7;
      margin-bottom: 5px;
    }
    
    .stat-value {
      font-size: 1.2em;
      font-weight: bold;
      color: #4ade80;
    }
    
    .download-progress {
      margin: 20px 0;
    }
    
    .download-progress-text {
      text-align: center;
      margin-bottom: 10px;
      font-size: 0.95em;
    }
    
    .download-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .download-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      transition: width 0.3s;
    }
    
    .info-message {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      font-size: 0.9em;
      text-align: center;
    }
    
    .info-message-icon {
      font-size: 1.5em;
      margin-bottom: 8px;
    }
    
    .volume-indicator {
      text-align: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 15px;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .volume-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .volume-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      transition: width 0.3s;
    }
    
    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }
      
      .header h1 {
        font-size: 1.6em;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .track-title {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎧 Music Sync</h1>
      <div class="room-info">
        Listener Mode • Room: <span id="roomName">Loading...</span>
      </div>
    </div>

    <!-- Status -->
    <div class="status connecting" id="status">
      <div class="spinner"></div>
      <span id="statusText">Connecting...</span>
    </div>

    <!-- Download Progress -->
    <div class="download-progress" id="downloadProgress" style="display: none;">
      <div class="download-progress-text" id="downloadText">Downloading audio...</div>
      <div class="download-progress-bar">
        <div class="download-progress-fill" id="downloadProgressFill"></div>
      </div>
    </div>

    <!-- Player -->
    <div class="player" id="player" style="display: none;">
      <div class="track-info">
        <div class="track-title" id="trackTitle">No track loaded</div>
        <div class="track-artist" id="trackArtist">—</div>
      </div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
      
      <div class="playback-indicator paused" id="playbackIndicator">
        ⏸️ Paused
      </div>
      
      <!-- Volume Indicator (Controlled by Host) -->
      <div class="volume-indicator">
        <span>🔊</span>
        <div class="volume-bar">
          <div class="volume-bar-fill" id="volumeBarFill" style="width: 100%;"></div>
        </div>
        <span id="volumeText">100%</span>
      </div>
    </div>

    <!-- Sync Stats -->
    <div class="sync-stats" id="syncStats" style="display: none;">
      <h3>📊 Sync Status</h3>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Network Ping</div>
          <div class="stat-value" id="pingValue">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Clock Offset</div>
          <div class="stat-value" id="clockOffsetValue">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Sync Accuracy</div>
          <div class="stat-value" id="syncAccuracyValue">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Drift</div>
          <div class="stat-value" id="driftValue">—</div>
        </div>
      </div>
    </div>

    <!-- Info Message -->
    <div class="info-message">
      <div class="info-message-icon">ℹ️</div>
      <div>The host controls playback, volume, and sync settings</div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════
    // ✅ LISTENER CLIENT (NO CONTROLS, HOST MANAGES EVERYTHING)
    // ═══════════════════════════════════════════════════════════
    
    const socket = io();
    const audio = document.getElementById('audioPlayer');
    
    const roomCode = new URLSearchParams(window.location.search).get('room');
    const listenerName = new URLSearchParams(window.location.search).get('name') || 'Listener';
    
    let clockOffset = 0;
    let manualDelay = 0; // Set by host
    let syncSamples = [];
    let scheduledPlayData = null;
    let syncCheckInterval = null;
    let lastCorrectionTime = 0;
    let isAudioFullyLoaded = false;
    let currentVolume = 1.0;
    let isMuted = false;
    
    if (!roomCode) {
      alert('No room code provided');
      window.location.href = '/';
    }
    
    // ═══════════════════════════════════════════════════════════
    // UI HELPERS
    // ═══════════════════════════════════════════════════════════
    
    function setStatus(text, className) {
      const statusEl = document.getElementById('status');
      const statusTextEl = document.getElementById('statusText');
      
      statusEl.className = 'status ' + className;
      statusTextEl.textContent = text;
      
      // Hide spinner for certain states
      const spinner = statusEl.querySelector('.spinner');
      if (className === 'ready' || className === 'error') {
        if (spinner) spinner.style.display = 'none';
      } else {
        if (spinner) spinner.style.display = 'block';
      }
    }
    
    function showPlayer() {
      document.getElementById('player').style.display = 'block';
      document.getElementById('syncStats').style.display = 'block';
    }
    
    function updatePlaybackIndicator(isPlaying) {
      const indicator = document.getElementById('playbackIndicator');
      if (isPlaying) {
        indicator.className = 'playback-indicator playing';
        indicator.textContent = '▶️ Playing';
      } else {
        indicator.className = 'playback-indicator paused';
        indicator.textContent = '⏸️ Paused';
      }
    }
    
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // ═══════════════════════════════════════════════════════════
    // NTP SYNC (HIGH ACCURACY)
    // ═══════════════════════════════════════════════════════════
    
    async function performNTPSync() {
      console.log('🕐 Performing NTP sync...');
      setStatus('Syncing clocks...', 'syncing');
      
      syncSamples = [];
      
      for (let i = 0; i < 10; i++) {
        const clientSendTime = performance.now();
        
        await new Promise(resolve => {
          socket.emit('ntp:sync', clientSendTime, (response) => {
            const clientReceiveTime = performance.now();
            
            const roundTripTime = clientReceiveTime - clientSendTime;
            const offset = ((response.serverReceiveTime - clientSendTime) + 
                           (response.serverSendTime - clientReceiveTime)) / 2;
            
            syncSamples.push({ offset, rtt: roundTripTime });
            resolve();
          });
        });
        
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      
      // Remove outliers and average
      syncSamples.sort((a, b) => a.rtt - b.rtt);
      const goodSamples = syncSamples.slice(0, 5);
      
      clockOffset = goodSamples.reduce((sum, s) => sum + s.offset, 0) / goodSamples.length;
      const avgPing = goodSamples.reduce((sum, s) => sum + s.rtt, 0) / goodSamples.length;
      
      const variance = goodSamples.reduce((sum, s) => 
        sum + Math.pow(s.offset - clockOffset, 2), 0) / goodSamples.length;
      const stdDev = Math.sqrt(variance);
      
      const accuracy = stdDev < 5 ? 'excellent' : stdDev < 15 ? 'good' : stdDev < 30 ? 'fair' : 'poor';
      
      console.log(`✅ Clock sync complete:`);
      console.log(`   Offset: ${clockOffset.toFixed(2)} ms`);
      console.log(`   Ping: ${avgPing.toFixed(2)} ms`);
      console.log(`   Accuracy: ${accuracy}`);
      
      // Update UI
      document.getElementById('clockOffsetValue').textContent = `${clockOffset.toFixed(0)}ms`;
      document.getElementById('pingValue').textContent = `${avgPing.toFixed(0)}ms`;
      document.getElementById('syncAccuracyValue').textContent = accuracy;
      
      // Send stats to server
      socket.emit('update-sync-stats', {
        roomCode,
        clockOffset: clockOffset,
        syncAccuracy: accuracy
      });
      
      // Update ping periodically
      setInterval(() => {
        socket.emit('update-ping', { roomCode, ping: avgPing.toFixed(0) });
      }, 5000);
    }
    
    // ═══════════════════════════════════════════════════════════
    // GET SERVER TIME
    // ═══════════════════════════════════════════════════════════
    
    function getServerTime() {
      return performance.now() + clockOffset + manualDelay;
    }
    
    // ═══════════════════════════════════════════════════════════
    // AUDIO LOADING (FULL DOWNLOAD WITH PROGRESS)
    // ═══════════════════════════════════════════════════════════
    
    async function loadAudio(url) {
      console.log('📥 Downloading audio...');
      setStatus('Downloading audio...', 'downloading');
      
      document.getElementById('downloadProgress').style.display = 'block';
      isAudioFullyLoaded = false;
      
      try {
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const contentLength = response.headers.get('content-length');
        const total = parseInt(contentLength, 10);
        let loaded = 0;
        
        const reader = response.body.getReader();
        const chunks = [];
        
        while (true) {
          const { done, value } = await reader.read();
          
          if (done) break;
          
          chunks.push(value);
          loaded += value.length;
          
          if (total) {
            const progress = Math.round((loaded / total) * 100);
            document.getElementById('downloadProgressFill').style.width = `${progress}%`;
            document.getElementById('downloadText').textContent = `Downloading audio... ${progress}%`;
          }
        }
        
        // Create blob
        const blob = new Blob(chunks, { type: 'audio/mpeg' });
        const objectUrl = URL.createObjectURL(blob);
        
        console.log(`✅ Audio downloaded: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);
        
        // Load into audio element
        audio.src = objectUrl;
        
        await new Promise((resolve, reject) => {
          audio.addEventListener('canplaythrough', resolve, { once: true });
          audio.addEventListener('error', reject, { once: true });
          audio.load();
        });
        
        isAudioFullyLoaded = true;
        
        document.getElementById('duration').textContent = formatTime(audio.duration);
        document.getElementById('downloadProgress').style.display = 'none';
        
        setStatus('Ready to play', 'ready');
        showPlayer();
        
        console.log('✅ Audio ready, duration:', audio.duration);
        
        // Notify server
        socket.emit('download-complete', { roomCode });
        socket.emit('sync-ready', { roomCode });
        
        // Start playback if pending
        if (scheduledPlayData) {
          syncToScheduledPlay(scheduledPlayData);
          startSyncMonitoring();
        }
        
      } catch (err) {
        console.error('❌ Failed to load audio:', err);
        setStatus('Failed to load audio', 'error');
        document.getElementById('downloadProgress').style.display = 'none';
      }
    }
    
    // ═══════════════════════════════════════════════════════════
    // SMOOTH SYNC ENGINE
    // ═══════════════════════════════════════════════════════════
    
    function syncToScheduledPlay(data) {
      if (!isAudioFullyLoaded) {
        console.warn('⚠️ Audio not ready, queuing...');
        scheduledPlayData = data;
        return;
      }
      
      const currentServerTime = getServerTime();
      const targetStartTime = data.scheduledStartTime;
      const targetPosition = data.offset / 1000;
      const timeUntilStart = targetStartTime - currentServerTime;
      
      console.log(`🎯 Sync: target=${targetStartTime}, current=${currentServerTime}, delay=${timeUntilStart.toFixed(0)}ms`);
      
      if (timeUntilStart > 100) {
        // Schedule future playback
        audio.currentTime = targetPosition;
        audio.playbackRate = 1.0;
        audio.pause();
        
        setTimeout(() => {
          audio.play().catch(err => {
            console.error('❌ Play failed:', err);
            // Auto-play might be blocked, try on user interaction
            document.body.addEventListener('click', () => audio.play(), { once: true });
          });
        }, timeUntilStart);
        
      } else if (timeUntilStart > -200) {
        // Start immediately
        audio.currentTime = targetPosition;
        audio.playbackRate = 1.0;
        audio.play().catch(err => {
          console.error('❌ Play failed:', err);
          document.body.addEventListener('click', () => audio.play(), { once: true });
        });
        
      } else {
        // Late start, catch up
        const catchUpPosition = targetPosition + (-timeUntilStart / 1000);
        console.log(`⚡ Late start, jumping to ${catchUpPosition.toFixed(3)}s`);
        audio.currentTime = catchUpPosition;
        audio.playbackRate = 1.0;
        audio.play().catch(err => console.error('❌ Play failed:', err));
      }
      
      scheduledPlayData = data;
      updatePlaybackIndicator(true);
    }
    
    // ═══════════════════════════════════════════════════════════
    // SMOOTH DRIFT CORRECTION
    // ═══════════════════════════════════════════════════════════
    
    function startSyncMonitoring() {
      if (syncCheckInterval) clearInterval(syncCheckInterval);
      
      syncCheckInterval = setInterval(() => {
        if (!scheduledPlayData || audio.paused || !isAudioFullyLoaded) return;
        
        const now = Date.now();
        const currentServerTime = getServerTime();
        const elapsedSinceScheduled = currentServerTime - scheduledPlayData.scheduledStartTime;
        const expectedPosition = (scheduledPlayData.offset + elapsedSinceScheduled) / 1000;
        const actualPosition = audio.currentTime;
        const positionError = (actualPosition - expectedPosition) * 1000;
        
        // Update drift display
        document.getElementById('driftValue').textContent = `${positionError.toFixed(0)}ms`;
        
        const absError = Math.abs(positionError);
        
        if (absError > 500) {
          // Large drift: Jump (but rate limit)
          if (now - lastCorrectionTime > 3000) {
            console.warn(`⚠️ Large drift: ${positionError.toFixed(0)}ms, correcting...`);
            audio.currentTime = expectedPosition;
            lastCorrectionTime = now;
          }
        } else if (absError > 100 && absError <= 500) {
          // Medium drift: Playback rate adjustment
          if (positionError > 0) {
            audio.playbackRate = 0.98; // Slow down
          } else {
            audio.playbackRate = 1.02; // Speed up
          }
          
          setTimeout(() => {
            if (audio.playbackRate !== 1.0) {
              audio.playbackRate = 1.0;
            }
          }, 2000);
        } else {
          // Small drift: Keep normal
          if (audio.playbackRate !== 1.0) {
            audio.playbackRate = 1.0;
          }
        }
        
      }, 3000);
    }
    
    // ═══════════════════════════════════════════════════════════
    // SOCKET EVENTS
    // ═══════════════════════════════════════════════════════════
    
    socket.on('connect', async () => {
      console.log('✅ Connected to server');
      setStatus('Syncing clocks...', 'syncing');
      
      // Perform NTP sync
      await performNTPSync();
      
      // Join room
      socket.emit('join-as-listener', { roomCode, listenerName }, async (response) => {
        if (response.error) {
          setStatus(response.error, 'error');
          setTimeout(() => window.location.href = '/', 3000);
          return;
        }
        
        console.log('✅ Joined room:', roomCode);
        document.getElementById('roomName').textContent = response.roomName;
        
        // Load audio if available
        if (response.audioUrl) {
          await loadAudio(response.audioUrl);
          
          document.getElementById('trackTitle').textContent = response.currentState.metadata.title;
          document.getElementById('trackArtist').textContent = response.currentState.metadata.artist;
          
          // Sync if playing
          if (response.currentState.playing && isAudioFullyLoaded) {
            syncToScheduledPlay({
              scheduledStartTime: response.currentState.scheduledStartTime,
              offset: response.currentState.startOffset,
              serverTime: response.currentState.serverTime
            });
            startSyncMonitoring();
          }
        } else {
          setStatus('Waiting for audio...', 'syncing');
        }
      });
    });
    
    socket.on('file:ready', async ({ url, metadata }) => {
      console.log('📥 New file ready:', metadata.title);
      document.getElementById('trackTitle').textContent = metadata.title;
      document.getElementById('trackArtist').textContent = metadata.artist;
      await loadAudio(url);
    });
    
    socket.on('sync:play', (data) => {
      console.log('▶️ Play command');
      syncToScheduledPlay(data);
      startSyncMonitoring();
    });
    
    socket.on('sync:pause', (data) => {
      console.log('⏸️ Pause command');
      audio.pause();
      audio.currentTime = data.position / 1000;
      audio.playbackRate = 1.0;
      scheduledPlayData = null;
      updatePlaybackIndicator(false);
      if (syncCheckInterval) clearInterval(syncCheckInterval);
    });
    
    socket.on('sync:stop', (data) => {
      console.log('⏹️ Stop command');
      audio.pause();
      audio.currentTime = 0;
      audio.playbackRate = 1.0;
      scheduledPlayData = null;
      updatePlaybackIndicator(false);
      if (syncCheckInterval) clearInterval(syncCheckInterval);
    });
    
    socket.on('sync:seek', (data) => {
      console.log('⏩ Seek command');
      audio.currentTime = data.position / 1000;
      audio.playbackRate = 1.0;
    });
    
    // ✅ HOST CONTROLS VOLUME
    socket.on('volume-update', ({ volume }) => {
      console.log('🔊 Volume updated by host:', volume);
      currentVolume = volume;
      audio.volume = isMuted ? 0 : volume;
      
      document.getElementById('volumeBarFill').style.width = `${volume * 100}%`;
      document.getElementById('volumeText').textContent = `${Math.round(volume * 100)}%`;
    });
    
    // ✅ HOST CONTROLS MUTE
    socket.on('mute-update', ({ muted }) => {
      console.log('🔇 Mute updated by host:', muted);
      isMuted = muted;
      audio.muted = muted;
      
      if (muted) {
        document.getElementById('volumeBarFill').style.width = '0%';
        document.getElementById('volumeText').textContent = 'Muted';
      } else {
        document.getElementById('volumeBarFill').style.width = `${currentVolume * 100}%`;
        document.getElementById('volumeText').textContent = `${Math.round(currentVolume * 100)}%`;
      }
    });
    
    // ✅ HOST CONTROLS DELAY
    socket.on('delay-update', ({ delay }) => {
      console.log('⏱️ Delay updated by host:', delay, 'ms');
      manualDelay = delay;
      
      // Re-sync if playing
      if (scheduledPlayData && !audio.paused) {
        syncToScheduledPlay(scheduledPlayData);
      }
    });
    
    socket.on('room-closed', () => {
      setStatus('Room closed', 'error');
      setTimeout(() => window.location.href = '/', 3000);
    });
    
    socket.on('disconnect', () => {
      setStatus('Disconnected', 'error');
    });
    
    // ═══════════════════════════════════════════════════════════
    // UI UPDATES
    // ═══════════════════════════════════════════════════════════
    
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        const progress = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
      }
    });
    
    console.log('🎧 Listener initialized');
  </script>
</body>
</html>
