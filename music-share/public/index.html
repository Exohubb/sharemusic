<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Sync - Professional Audio Synchronization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }
    
    .navbar {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      padding: 20px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    
    .navbar-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.8em;
      font-weight: bold;
    }
    
    .logo-icon {
      font-size: 2em;
    }
    
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .hero {
      text-align: center;
      margin-bottom: 60px;
      padding: 40px 20px;
    }
    
    .hero h1 {
      font-size: 3em;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    
    .hero p {
      font-size: 1.2em;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .create-room-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .create-room-section h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2em;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 1.1em;
    }
    
    .form-group input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1.1em;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #4ade80;
      background: rgba(255, 255, 255, 0.15);
    }
    
    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 222, 128, 0.6);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .rooms-section {
      margin-top: 60px;
    }
    
    .rooms-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .rooms-header h2 {
      font-size: 2em;
    }
    
    .room-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
    }
    
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }
    
    .room-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    .room-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border-color: #4ade80;
    }
    
    .room-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #4ade80, #22c55e);
    }
    
    .room-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 0.9em;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85em;
      font-weight: bold;
    }
    
    .status-badge.playing {
      background: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    
    .status-badge.idle {
      background: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }
    
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .room-name {
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 10px;
      color: white;
    }
    
    .room-host {
      font-size: 0.95em;
      opacity: 0.8;
      margin-bottom: 10px;
    }
    
    .room-track {
      font-size: 0.9em;
      opacity: 0.7;
      margin-bottom: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .room-stats {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9em;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
    }
    
    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }
    
    .empty-state p {
      opacity: 0.7;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    
    .modal-header h3 {
      font-size: 1.8em;
    }
    
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 2em;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    
    .close-btn:hover {
      opacity: 1;
    }
    
    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2em;
      }
      
      .hero p {
        font-size: 1em;
      }
      
      .create-room-section {
        padding: 25px;
      }
      
      .rooms-grid {
        grid-template-columns: 1fr;
      }
      
      .modal-content {
        padding: 25px;
      }
      
      .modal-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <div class="logo">
        <span class="logo-icon">🎵</span>
        <span>Music Sync</span>
      </div>
      <div class="room-count" id="globalRoomCount">
        0 Active Rooms
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Hero Section -->
    <div class="hero">
      <h1>🎧 Professional Audio Synchronization</h1>
      <p>Create a room, invite friends, and listen to music in perfect sync across multiple devices</p>
    </div>

    <!-- Create Room Section -->
    <div class="create-room-section">
      <h2>🎙️ Create Your Room</h2>
      <form id="createRoomForm">
        <div class="form-group">
          <label for="roomName">Room Name</label>
          <input 
            type="text" 
            id="roomName" 
            placeholder="My Awesome Music Room"
            maxlength="50"
            required
          >
        </div>
        <div class="form-group">
          <label for="hostName">Your Name (Host)</label>
          <input 
            type="text" 
            id="hostName" 
            placeholder="DJ Master"
            maxlength="30"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary">
          🚀 Create Room
        </button>
      </form>
    </div>

    <!-- Active Rooms Section -->
    <div class="rooms-section">
      <div class="rooms-header">
        <h2>🏠 Active Rooms</h2>
        <div class="room-count" id="roomCount">0 Rooms</div>
      </div>
      
      <div id="roomsContainer">
        <div class="empty-state">
          <div class="empty-state-icon">🎵</div>
          <h3>No Active Rooms</h3>
          <p>Be the first to create a room!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Join Room Modal -->
  <div class="modal" id="joinModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Join Room</h3>
        <button class="close-btn" onclick="closeJoinModal()">&times;</button>
      </div>
      
      <div class="form-group">
        <label>Room Name</label>
        <input type="text" id="selectedRoomName" readonly style="opacity: 0.7;">
      </div>
      
      <div class="form-group">
        <label for="listenerName">Your Name</label>
        <input 
          type="text" 
          id="listenerName" 
          placeholder="Listener"
          maxlength="30"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="joinCode">Room Code (4 digits)</label>
        <input 
          type="text" 
          id="joinCode" 
          placeholder="1234"
          maxlength="4"
          pattern="[0-9]{4}"
          required
        >
      </div>
      
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeJoinModal()">Cancel</button>
        <button class="btn btn-primary" onclick="joinRoom()">Join</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let selectedRoomCode = null;

    // ═══════════════════════════════════════════════════════════
    // CREATE ROOM
    // ═══════════════════════════════════════════════════════════

    document.getElementById('createRoomForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const roomName = document.getElementById('roomName').value.trim();
      const hostName = document.getElementById('hostName').value.trim();
      
      if (!roomName || !hostName) {
        alert('Please fill in all fields');
        return;
      }
      
      console.log('Creating room:', roomName);
      
      socket.emit('create-room', { roomName, hostName }, (response) => {
        if (response.success) {
          console.log('✅ Room created:', response.roomCode);
          window.location.href = `/host.html?room=${response.roomCode}`;
        } else {
          alert('Failed to create room: ' + (response.error || 'Unknown error'));
        }
      });
    });

    // ═══════════════════════════════════════════════════════════
    // ROOM LIST
    // ═══════════════════════════════════════════════════════════

    socket.on('room-list', (rooms) => {
      console.log('📋 Room list updated:', rooms.length, 'rooms');
      
      const container = document.getElementById('roomsContainer');
      const roomCountEl = document.getElementById('roomCount');
      const globalRoomCountEl = document.getElementById('globalRoomCount');
      
      roomCountEl.textContent = `${rooms.length} Room${rooms.length !== 1 ? 's' : ''}`;
      globalRoomCountEl.textContent = `${rooms.length} Active Room${rooms.length !== 1 ? 's' : ''}`;
      
      if (rooms.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎵</div>
            <h3>No Active Rooms</h3>
            <p>Be the first to create a room!</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = `
        <div class="rooms-grid">
          ${rooms.map(room => createRoomCard(room)).join('')}
        </div>
      `;
      
      // Add click handlers
      document.querySelectorAll('.room-card').forEach(card => {
        card.addEventListener('click', () => {
          const roomCode = card.dataset.roomCode;
          const roomName = card.dataset.roomName;
          openJoinModal(roomCode, roomName);
        });
      });
    });

    function createRoomCard(room) {
      const statusClass = room.isPlaying ? 'playing' : 'idle';
      const statusText = room.isPlaying ? 'Playing' : 'Idle';
      
      return `
        <div class="room-card" data-room-code="${room.roomCode}" data-room-name="${room.roomName}">
          <div class="room-status">
            <span class="status-badge ${statusClass}">
              <span class="pulse"></span>
              ${statusText}
            </span>
          </div>
          
          <div class="room-name">${escapeHtml(room.roomName)}</div>
          <div class="room-host">🎤 Host: ${escapeHtml(room.hostName)}</div>
          <div class="room-track">
            ${room.hasAudio ? '🎵 ' + escapeHtml(room.trackTitle) : '⏸️ No track loaded'}
          </div>
          
          <div class="room-stats">
            <div class="stat">
              <span>👥</span>
              <span>${room.listenerCount} ${room.listenerCount === 1 ? 'Listener' : 'Listeners'}</span>
            </div>
            <div class="stat">
              <span>🔑</span>
              <span>Code Required</span>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ═══════════════════════════════════════════════════════════
    // JOIN MODAL
    // ═══════════════════════════════════════════════════════════

    function openJoinModal(roomCode, roomName) {
      selectedRoomCode = roomCode;
      document.getElementById('selectedRoomName').value = roomName;
      document.getElementById('joinCode').value = '';
      document.getElementById('listenerName').value = '';
      document.getElementById('joinModal').classList.add('active');
    }

    function closeJoinModal() {
      document.getElementById('joinModal').classList.remove('active');
      selectedRoomCode = null;
    }

    function joinRoom() {
      const listenerName = document.getElementById('listenerName').value.trim();
      const joinCode = document.getElementById('joinCode').value.trim();
      
      if (!listenerName) {
        alert('Please enter your name');
        return;
      }
      
      if (!joinCode || joinCode.length !== 4) {
        alert('Please enter a valid 4-digit room code');
        return;
      }
      
      if (joinCode !== selectedRoomCode) {
        alert('Invalid room code. Please ask the host for the correct code.');
        return;
      }
      
      console.log('Joining room:', selectedRoomCode);
      window.location.href = `/listener.html?room=${selectedRoomCode}&name=${encodeURIComponent(listenerName)}`;
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeJoinModal();
      }
    });

    // ═══════════════════════════════════════════════════════════
    // INITIAL LOAD
    // ═══════════════════════════════════════════════════════════

    socket.on('connect', () => {
      console.log('✅ Connected to server');
      socket.emit('get-rooms', (rooms) => {
        socket.emit('room-list', rooms);
      });
    });

    socket.on('disconnect', () => {
      console.log('❌ Disconnected from server');
    });
  </script>
</body>
</html>
