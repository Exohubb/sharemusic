<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Music Share</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .header .subtitle { font-size: 18px; opacity: 0.9; }
    .header .tech-badge {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: white;
      padding: 8px 20px;
      border-radius: 25px;
      display: inline-block;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
    }
    .main-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .action-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .action-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    .action-card .icon { font-size: 60px; margin-bottom: 15px; }
    .action-card h2 { color: #667eea; margin-bottom: 10px; font-size: 24px; }
    .action-card p { color: #6b7280; font-size: 14px; line-height: 1.6; }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-content h2 {
      color: #667eea;
      margin-bottom: 25px;
      font-size: 28px;
      text-align: center;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎵 Music Share</h1>
      <p class="subtitle">Real-time audio streaming with zero latency</p>
      <div class="tech-badge">🚀 Powered by Appwrite + NTP Sync</div>
    </div>

    <div class="main-actions">
      <div class="action-card" onclick="showHostModal()">
        <div class="icon">🎛️</div>
        <h2>Create Room</h2>
        <p>Host your audio stream and get a unique room code to share</p>
      </div>

      <div class="action-card" onclick="showListenerModal()">
        <div class="icon">🎧</div>
        <h2>Join Room</h2>
        <p>Enter a room code to listen to live audio streams</p>
      </div>
    </div>
  </div>

  <!-- Host Modal -->
  <div id="hostModal" class="modal">
    <div class="modal-content">
      <h2>🎛️ Create Your Room</h2>
      <div class="form-group">
        <label for="hostName">Your Name</label>
        <input type="text" id="hostName" placeholder="Enter your name" maxlength="20" value="Host">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeHostModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
      </div>
    </div>
  </div>

  <!-- Listener Modal -->
  <div id="listenerModal" class="modal">
    <div class="modal-content">
      <h2>🎧 Join a Room</h2>
      <div class="form-group">
        <label for="roomCodeInput">Room Code</label>
        <input type="text" id="roomCodeInput" placeholder="Enter 4-digit code" maxlength="4" pattern="[0-9]*" style="text-align: center; font-size: 24px; letter-spacing: 5px;">
      </div>
      <div class="form-group">
        <label for="listenerName">Your Name</label>
        <input type="text" id="listenerName" placeholder="Enter your name" maxlength="20" value="Listener">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeListenerModal()">Cancel</button>
        <button class="btn btn-primary" onclick="joinRoom()">Join Room</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function showHostModal() {
      document.getElementById('hostModal').classList.add('active');
      document.getElementById('hostName').focus();
    }

    function closeHostModal() {
      document.getElementById('hostModal').classList.remove('active');
    }

    function showListenerModal() {
      document.getElementById('listenerModal').classList.add('active');
      document.getElementById('roomCodeInput').focus();
    }

    function closeListenerModal() {
      document.getElementById('listenerModal').classList.remove('active');
    }

    function createRoom() {
      const hostName = document.getElementById('hostName').value.trim() || 'Host';
      console.log('Creating room...');
      
      socket.emit('create-room', { hostName }, (response) => {
        if (response.success) {
          console.log('Room created:', response.roomCode);
          window.location.href = `host.html?room=${response.roomCode}`;
        } else {
          alert('Failed to create room');
        }
      });
    }

    function joinRoom() {
      const roomCode = document.getElementById('roomCodeInput').value.trim();
      const listenerName = document.getElementById('listenerName').value.trim() || 'Listener';
      
      if (roomCode.length !== 4) {
        alert('Please enter a 4-digit room code');
        return;
      }
      
      if (!/^\d{4}$/.test(roomCode)) {
        alert('Room code must be 4 digits');
        return;
      }
      
      window.location.href = `listener.html?room=${roomCode}&name=${encodeURIComponent(listenerName)}`;
    }

    // Close modals on background click
    document.getElementById('hostModal').addEventListener('click', (e) => {
      if (e.target.id === 'hostModal') closeHostModal();
    });

    document.getElementById('listenerModal').addEventListener('click', (e) => {
      if (e.target.id === 'listenerModal') closeListenerModal();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeHostModal();
        closeListenerModal();
      }
      if (e.key === 'Enter') {
        if (document.getElementById('hostModal').classList.contains('active')) {
          createRoom();
        } else if (document.getElementById('listenerModal').classList.contains('active')) {
          joinRoom();
        }
      }
    });

    // Room code input - numbers only
    document.getElementById('roomCodeInput').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    socket.on('connect', () => {
      console.log('✅ Connected to server');
    });

    socket.on('disconnect', () => {
      console.log('❌ Disconnected from server');
    });
  </script>
</body>
</html>
